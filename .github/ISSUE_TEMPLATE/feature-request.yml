name: Feature Request
description: 사용자가 겪는 문제를 해결할 기능을 제안합니다.
title: "[Feature] "
body:
  - type: textarea
    id: user_problem
    attributes:
      label: 사용자 문제
      description: 누가 어떤 상황에서 무엇 때문에 불편한가요?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과
      description: 기능이 완료되면 사용자가 무엇을 할 수 있어야 하나요?
    validations:
      required: true

  - type: textarea
    id: flow
    attributes:
      label: 예상 흐름
      placeholder: |
        1. 사용자가 ...
        2. 시스템이 ...
        3. 사용자가 결과를 확인

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 확인하거나 테스트할 수 있는 기준을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 이번 범위에서 하지 않을 것
      description: 자동 제출, 법적 판단 등 제외할 내용을 적어 주세요.

  - type: checkboxes
    id: safety
    attributes:
      label: 확인
      options:
        - label: 실제 개인정보나 Secret을 포함하지 않았습니다.
          required: true
